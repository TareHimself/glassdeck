[package]
name = "glassdeck-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
glassdeck-luau.workspace = true
glassdeck-messages.workspace = true
glassdeck-package.workspace = true
glow = "0.16"
serde_json.workspace = true
mlua = { version = "0.12.3", features = ["luau", "luau-vector4"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"
glassdeck-proto.workspace = true
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
rustix = { version = "1.1.6", features = ["net", "time"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
