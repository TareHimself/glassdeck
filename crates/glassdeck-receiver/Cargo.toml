[package]
name = "glassdeck-receiver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
glassdeck-proto.workspace = true
glassdeck-package.workspace = true
glassdeck-layout.workspace = true
glassdeck-luau.workspace = true
mlua = { version = "0.12.3", features = ["luau", "serde"] }
resvg = { version = "0.50.0", default-features = false, features = ["raster-images"] }
serde_json.workspace = true
fontdue.workspace = true

[target.'cfg(windows)'.dependencies]
minifb.workspace = true
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.15.0"
rustix = { version = "1.1.6", features = ["fs", "net", "process", "time"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
cc = "1.11.3"
pkg-config = "0.3.34"
