[package]
name = "glassdeckd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
getrandom = "0.4.3"
glassdeck-capture.workspace = true
glassdeck-host.workspace = true
glassdeck-luau.workspace = true
glassdeck-package.workspace = true
glassdeck-proto.workspace = true
mlua = { version = "0.12.3", features = ["luau", "serde"] }
nusb = "0.2.9"
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows.workspace = true
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
glassdeck-api.workspace = true
str0m = { version = "0.26", default-features = false, features = ["wincrypto"] }
