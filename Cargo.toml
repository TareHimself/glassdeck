[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
glassdeck-package = { path = "crates/glassdeck-package" }
glassdeck-capture = { path = "crates/glassdeck-capture" }
glassdeck-layout = { path = "crates/glassdeck-layout" }
glassdeck-luau = { path = "crates/glassdeck-luau" }
glassdeck-proto = { path = "crates/glassdeck-proto" }
glassdeck-wallpaper-engine = { path = "crates/glassdeck-wallpaper-engine" }
fontdue = "0.9.5"
minifb = "0.29.0"
openh264 = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-capture = "2.0.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
