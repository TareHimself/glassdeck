[package]
name = "glassdeck-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
anyhow.workspace = true
futures-util = "0.3.31"
glassdeck-api.workspace = true
glassdeck-layout.workspace = true
glassdeck-package.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.15"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["time"] }
trash = "5.4.0"
